name: websocket-chat-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build image
        run: docker build -t sky-websocket-chat:ci .
      - name: Verify non-root image
        run: |
          user="$(docker image inspect sky-websocket-chat:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"
      - name: Smoke test health endpoint
        run: |
          docker run -d --rm --name sky-websocket-chat-ci -p 13000:3000 sky-websocket-chat:ci
          trap 'docker stop sky-websocket-chat-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:13000/healthz | grep -q '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          docker logs sky-websocket-chat-ci
          exit 1
